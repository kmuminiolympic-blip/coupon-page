<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰 사용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --green:        #7a8c45;
    --green-dark:   #4a5a28;
    --green-light:  #e8f0d0;
    --lavender:     #e8dff5;
    --purple:       #8b5cf6;
    --purple-dark:  #6d28d9;
    --red:          #e53e3e;
    --text-dark:    #1a1a1a;
    --text-mid:     #555;
    --text-light:   #999;
    --bg:           #f0f4e8;
    --radius-card:  28px;
    --radius-btn:   18px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  /* 로딩 */
  .loading-page { text-align:center; color:var(--green-dark); font-size:14px; }
  .loading-spinner {
    width:40px; height:40px;
    border:3px solid var(--green-light);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 에러 */
  .error-page {
    text-align:center; background:white;
    border-radius:var(--radius-card);
    padding:48px 32px; max-width:380px;
    border:3px solid var(--green-dark);
    box-shadow:6px 6px 0 var(--green-dark);
  }
  .error-icon  { font-size:48px; margin-bottom:16px; }
  .error-title { font-size:20px; font-weight:800; color:var(--text-dark); margin-bottom:8px; }
  .error-desc  { font-size:14px; color:var(--text-mid); }

  /* 쿠폰 래퍼 */
  .coupon-wrapper {
    width:100%; max-width:380px;
    animation:fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* 메인 카드 */
  .coupon-card {
    border:3px solid var(--green-dark);
    border-radius:var(--radius-card);
    overflow:hidden;
    box-shadow:6px 6px 0 var(--green-dark);
    position:relative;
    transition:filter 0.4s;
  }
  .coupon-card.used { filter:grayscale(0.4); }

  /* 상단 그린 헤더 */
  .coupon-top {
    background:var(--green);
    padding:24px 24px 20px;
    position:relative;
  }

  /* 로고 행 */
  .logo-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .team-logo { display:flex; align-items:center; gap:8px; }
  .team-logo-icon { width:40px; height:40px; }
  .team-logo-text {
    font-size:12px; font-weight:800; color:var(--green-dark);
    letter-spacing:1.5px; text-transform:uppercase; line-height:1;
  }
  .vendor-logo-slot {
    width:60px; height:60px;
    display:flex; align-items:center; justify-content:center;
  }

  /* 텍스트 */
  .vendor-name-text {
    font-size:20px; font-weight:700; color:var(--green-dark);
    margin-bottom:4px; letter-spacing:-0.5px;
  }
  .coupon-type-text {
    font-size:32px; font-weight:900; color:var(--text-dark);
    line-height:1.15; letter-spacing:-1px; margin-bottom:10px;
    font-family:'Black Han Sans', sans-serif;
  }
  .coupon-name-small {
    text-align:right; font-size:13px; font-weight:600;
    color:var(--green-dark); opacity:0.7;
  }

  /* 점선 구분선 */
  .ticket-divider {
    height:3px; background:var(--green-dark);
    position:relative; overflow:visible;
    display:flex; align-items:center;
  }
  .ticket-divider::before,
  .ticket-divider::after {
    content:''; position:absolute;
    width:30px; height:30px;
    background:var(--bg);
    border-radius:50%;
    border:3px solid var(--green-dark);
    top:50%; transform:translateY(-50%); z-index:2;
  }
  .ticket-divider::before { left:-15px; }
  .ticket-divider::after  { right:-15px; }
  .ticket-divider-inner {
    flex:1; border-top:3px dashed rgba(255,255,255,0.35);
    margin:0 18px; position:relative; z-index:1;
  }

  /* 하단 연보라 섹션 */
  .coupon-bottom {
    background:var(--lavender);
    padding:20px 24px 22px;
  }

  /* 날짜 + 배지 */
  .meta-row {
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:4px;
  }
  .meta-dates { display:flex; gap:28px; }
  .meta-label {
    font-size:11px; font-weight:700; color:var(--text-mid);
    letter-spacing:0.5px; margin-bottom:4px;
  }
  .meta-value {
    font-size:15px; font-weight:700; color:var(--text-dark);
    letter-spacing:-0.3px;
  }
  .meta-value.expired-date { color:var(--red); }

  .status-badge {
    background:var(--purple); color:white;
    font-size:12px; font-weight:700;
    padding:4px 14px; border-radius:20px;
    white-space:nowrap; letter-spacing:0.3px;
    box-shadow:2px 2px 0 var(--purple-dark);
  }
  .status-badge.used-badge    { background:#9ca3af; box-shadow:2px 2px 0 #6b7280; }
  .status-badge.expired-badge { background:var(--red); box-shadow:2px 2px 0 #9b1c1c; }

  .used-date-row { margin-bottom:4px; }

  /* 버튼 */
  .btn-use {
    width:100%;
    background:var(--purple);
    color:white; border:none;
    border-radius:var(--radius-btn);
    padding:17px;
    font-size:18px; font-weight:800;
    cursor:pointer;
    font-family:'Black Han Sans', sans-serif;
    letter-spacing:1px; margin-top:16px;
    box-shadow:3px 3px 0 var(--purple-dark);
    transition:transform 0.12s, box-shadow 0.12s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-use:hover  { transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--purple-dark); }
  .btn-use:active { transform:translate(2px,2px);   box-shadow:1px 1px 0 var(--purple-dark); }
  .btn-use.used-btn {
    background:#d1d5db; box-shadow:3px 3px 0 #9ca3af;
    cursor:not-allowed; pointer-events:none; color:#6b7280;
  }

  /* 토큰 */
  .token-strip {
    margin-top:12px; text-align:center;
    font-size:11px; color:var(--text-light);
    letter-spacing:0.3px; font-family:monospace; word-break:break-all;
  }

  /* USED 스탬프 */
  .used-stamp {
    position:absolute; top:42%; left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    border:5px solid rgba(100,116,139,0.55);
    color:rgba(100,116,139,0.55);
    border-radius:12px; padding:6px 22px;
    font-size:42px; font-weight:900; letter-spacing:6px;
    pointer-events:none; z-index:10;
    font-family:'Black Han Sans', sans-serif;
    white-space:nowrap; display:none;
  }
  .coupon-card.used .used-stamp { display:block; }

  /* 확인 오버레이 */
  .confirm-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.45); z-index:1000;
    align-items:flex-end; justify-content:center; padding:20px;
  }
  .confirm-overlay.show { display:flex; }
  .confirm-sheet {
    background:white; border-radius:24px 24px 20px 20px;
    border:3px solid var(--green-dark);
    padding:28px 24px; width:100%; max-width:380px;
    animation:slideUp 0.22s ease;
    box-shadow:0 -4px 0 var(--green-dark);
  }
  @keyframes slideUp {
    from { transform:translateY(40px); opacity:0; }
    to   { transform:translateY(0);    opacity:1; }
  }
  .confirm-warn {
    background:#fff7ed; border:2px solid #fed7aa;
    border-radius:12px; padding:12px 16px;
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .warn-icon { font-size:20px; }
  .warn-text { font-size:14px; font-weight:600; color:#92400e; line-height:1.4; }
  .confirm-title { font-size:18px; font-weight:800; color:var(--text-dark); margin-bottom:6px; }
  .confirm-desc  { font-size:13px; color:#6b7280; margin-bottom:22px; line-height:1.6; }
  .confirm-btns  { display:flex; gap:10px; }
  .btn-cancel {
    flex:1; background:#f3f4f6; border:2px solid #d1d5db;
    border-radius:12px; padding:14px;
    font-size:14px; font-weight:700; color:#6b7280; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif; transition:background 0.15s;
  }
  .btn-cancel:hover { background:#e5e7eb; }
  .btn-confirm-use {
    flex:2; background:var(--purple); color:white; border:none;
    border-radius:12px; padding:14px;
    font-size:15px; font-weight:800; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    box-shadow:3px 3px 0 var(--purple-dark); transition:all 0.12s;
  }
  .btn-confirm-use:hover    { opacity:0.9; }
  .btn-confirm-use:disabled { opacity:0.6; cursor:not-allowed; }

  /* 업체별 헤더 색상 오버라이드 */
  .vendor-풍동         .coupon-top { background:#c8a86b; }
  .vendor-풍동         .vendor-name-text, .vendor-풍동 .team-logo-text { color:#5a3a10; }
  .vendor-해방피플클럽 .coupon-top { background:#6b8fc4; }
  .vendor-해방피플클럽 .vendor-name-text, .vendor-해방피플클럽 .team-logo-text { color:#1e3a6e; }
  .vendor-수기소금     .coupon-top { background:#c47070; }
  .vendor-수기소금     .vendor-name-text, .vendor-수기소금 .team-logo-text { color:#5a1010; }
  .vendor-눈을담다     .coupon-top { background:#8b7cc4; }
  .vendor-눈을담다     .vendor-name-text, .vendor-눈을담다 .team-logo-text { color:#2d1f5e; }
</style>
</head>
<body>

<div id="app">
  <div class="loading-page">
    <div class="loading-spinner"></div>
    쿠폰 정보를 불러오는 중...
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <div class="confirm-warn">
      <span class="warn-icon">⚠️</span>
      <span class="warn-text">사용하면 쿠폰이 소멸됩니다.</span>
    </div>
    <div class="confirm-title">쿠폰을 사용하시겠습니까?</div>
    <div class="confirm-desc">이 쿠폰은 일회성입니다.<br>사용 후에는 다시 사용할 수 없습니다.</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="cancelUse()">취소</button>
      <button class="btn-confirm-use" id="confirmBtn" onclick="confirmUse()">사용하기</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://scanpvkimaicpergakbe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy';
const TABLE = 'coupons';

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...options.headers
    },
    ...options
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || res.statusText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function dbGetCouponByToken(token) {
  const data = await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}&limit=1`);
  return data && data.length > 0 ? data[0] : null;
}

async function dbMarkUsed(token) {
  const usedDate = new Date().toISOString().split('T')[0];
  await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}`, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'used', used_date: usedDate })
  });
  return usedDate;
}

const params = new URLSearchParams(location.search);
const token  = params.get('token');
let couponData = null;

/* 다람쥐 SVG (Team Green 로고) */
const squirrelSVG = `<svg class="team-logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M50 75 C35 75 22 63 22 50 C22 37 35 28 50 28 C65 28 78 37 78 50 C78 63 65 75 50 75Z" fill="#4a5a28"/>
  <path d="M38 28 C36 18 42 10 50 10 C44 18 46 24 42 28Z" fill="#4a5a28"/>
  <path d="M62 28 C64 18 58 10 50 10 C56 18 54 24 58 28Z" fill="#4a5a28"/>
  <path d="M24 50 C14 46 10 36 16 28 C18 38 26 44 30 46Z" fill="#4a5a28"/>
  <circle cx="42" cy="46" r="4" fill="white"/>
  <circle cx="58" cy="46" r="4" fill="white"/>
  <circle cx="43" cy="47" r="2" fill="#222"/>
  <circle cx="59" cy="47" r="2" fill="#222"/>
  <ellipse cx="50" cy="56" rx="8" ry="5" fill="#6b7c3a"/>
  <rect x="44" y="68" width="12" height="10" rx="5" fill="#6b7c3a"/>
</svg>`;

async function init() {
  if (!token) { renderError('유효하지 않은 쿠폰입니다', '쿠폰 링크를 다시 확인해주세요.'); return; }

  try {
    couponData = await dbGetCouponByToken(token);
  } catch (e) {
    renderError('서버 연결 오류', '잠시 후 다시 시도해주세요: ' + e.message);
    return;
  }

  if (!couponData) { renderError('쿠폰을 찾을 수 없습니다', '만료되었거나 존재하지 않는 쿠폰입니다.'); return; }
  if (couponData.status === 'deleted') { renderError('삭제된 쿠폰입니다', '이 쿠폰은 더 이상 유효하지 않습니다.'); return; }

  const today     = new Date().toISOString().split('T')[0];
  const isExpired = couponData.expire_date && today > couponData.expire_date && couponData.status !== 'used';
  const isUsed    = couponData.status === 'used';
  renderCoupon(isUsed, isExpired);
}

function renderError(title, desc) {
  document.getElementById('app').innerHTML = `
    <div class="error-page">
      <div class="error-icon">❌</div>
      <div class="error-title">${title}</div>
      <div class="error-desc">${desc}</div>
    </div>`;
}

function renderCoupon(isUsed, isExpired) {
  const c = couponData;
  const vendorClass   = 'vendor-' + c.vendor.replace(/\s/g, '');
  const badgeClass    = isUsed ? 'status-badge used-badge' : isExpired ? 'status-badge expired-badge' : 'status-badge';
  const badgeText     = isUsed ? '사용완료' : isExpired ? '기간만료' : '미사용';
  const btnClass      = (isUsed || isExpired) ? 'btn-use used-btn' : 'btn-use';
  const btnText       = isUsed ? '✓ 사용완료' : isExpired ? '기간 만료됨' : '쿠폰 사용하기';
  const disabled      = (isUsed || isExpired) ? 'disabled' : '';
  const expireClass   = isExpired ? 'meta-value expired-date' : 'meta-value';
  const tokenDisplay  = c.token ? c.token.substring(0, 32) + '...' : '';

  document.getElementById('app').innerHTML = `
    <div class="coupon-wrapper">
      <div class="coupon-card ${isUsed ? 'used' : ''} ${vendorClass}">

        <div class="used-stamp">USED</div>

        <!-- 상단 그린 헤더 -->
        <div class="coupon-top">
          <div class="logo-row">
            <div class="team-logo">
              ${squirrelSVG}
              <div class="team-logo-text">TEAM GREEN</div>
            </div>
            <div class="vendor-logo-slot">
              ${c.vendor_image ? `<img src="${c.vendor_image}" alt="${c.vendor}" style="width:100%;height:100%;object-fit:contain;">` : ''}
            </div>
          </div>
          <div class="vendor-name-text">${c.vendor}</div>
          <div class="coupon-type-text">${c.coupon_type || c.title}</div>
          <div class="coupon-name-small">${c.title}</div>
        </div>

        <!-- 티켓 점선 구분선 -->
        <div class="ticket-divider"><div class="ticket-divider-inner"></div></div>

        <!-- 하단 연보라 섹션 -->
        <div class="coupon-bottom">
          <div class="meta-row">
            <div class="meta-dates">
              <div class="meta-item">
                <div class="meta-label">발급일</div>
                <div class="meta-value">${c.issued_date || '-'}</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">만료일</div>
                <div class="${expireClass}">${c.expire_date || '-'}</div>
              </div>
            </div>
            <div class="${badgeClass}">${badgeText}</div>
          </div>

          ${isUsed ? `<div class="used-date-row">
            <div class="meta-label" style="margin-top:10px;">사용일</div>
            <div class="meta-value">${c.used_date || '-'}</div>
          </div>` : ''}

          <button class="${btnClass}" id="useBtn" onclick="requestUse()" ${disabled}>
            🎫 ${btnText}
          </button>

          <div class="token-strip">${tokenDisplay}</div>
        </div>
      </div>
    </div>`;
}

function requestUse() { document.getElementById('confirmOverlay').classList.add('show'); }
function cancelUse()  { document.getElementById('confirmOverlay').classList.remove('show'); }

async function confirmUse() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = '처리 중...';
  try {
    const usedDate = await dbMarkUsed(token);
    couponData.status    = 'used';
    couponData.used_date = usedDate;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '사용하기';
    alert('오류가 발생했습니다: ' + e.message);
    return;
  }
  document.getElementById('confirmOverlay').classList.remove('show');
  renderCoupon(true, false);
}

init();
</script>
</body>
</html>
